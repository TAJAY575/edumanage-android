plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edumanage.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.edumanage.app"
        minSdk 21
        targetSdk 36
        // CI passes GITHUB_RUN_NUMBER so every release has a higher versionCode and
        // installs over the previous one (a fixed versionCode refuses to update).
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "2")
        versionName "1.1.0"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_PATH") ?: "keystore.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation 'androidx.appcompat:appcompat:1.7.1'
}
