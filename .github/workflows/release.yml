name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # GitHub's runners already include the Android SDK; android-actions/setup-android@v3
      # now fails on the preinstalled sdkmanager, so just accept the licenses ourselves.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode keystore from secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease bundleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk EduManage.apk
          mv app/build/outputs/bundle/release/app-release.aab EduManage.aab

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: EduManage Android v${{ github.run_number }}
          body: |
            EduManage Android app — sideload this APK on any Android device.

            **Install instructions:**
            1. Download EduManage.apk below
            2. Open the file on your Android phone
            3. Tap Install (allow "Install from unknown sources" if prompted)

            EduManage.aab is the Google Play upload bundle (see PLAY_STORE.md).
          files: |
            EduManage.apk
            EduManage.aab
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
